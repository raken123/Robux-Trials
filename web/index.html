<!doctype html>
<html lang="sv">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A237E">
<title>Islamiska Förbundet</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root {
  --navy: #1A237E; --navy-dark: #0F1450; --gold: #C4B357; --gold-light: #E6DAA0;
  --bg: #FAF8F0; --surface: #FFFFFF; --surface-2: #EDEBE2; --text: #15183A; --muted: #5A5E7A;
  --primary: var(--navy); --on-primary: #fff; --danger: #B3261E; --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E2E; --surface: #161A45; --surface-2: #1C2050; --text: #F2F1EA; --muted: #A9ACC8;
    --primary: var(--gold); --on-primary: var(--navy-dark); --danger: #FFB4AB;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E2E; --surface: #161A45; --surface-2: #1C2050; --text: #F2F1EA; --muted: #A9ACC8;
  --primary: var(--gold); --on-primary: var(--navy-dark); --danger: #FFB4AB;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

button, input, select { font: inherit; color: inherit; }
a { color: var(--primary); }

.hero p { margin: 0; color: var(--gold-light); font-size: .9rem; }
.hero .grow { flex: 1; min-width: 0; }

.pad { padding: 16px; display: grid; gap: 12px; }

  box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card.click { cursor: pointer; }

.muted { color: var(--muted); font-size: .85rem; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--primary); color: var(--on-primary);

.btn.gold { background: var(--gold); color: var(--navy-dark); }
.btn.outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn.text { background: transparent; color: var(--primary); padding: 8px 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

.tool span { font-size: .78rem; }

.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  padding: 8px 0; border-bottom: 1px solid var(--surface-2); }
.prayer-row:last-child { border-bottom: 0; }
.icon-btn { border: 0; background: transparent; font-size: 1.3rem; cursor: pointer; padding: 4px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--navy); }
.field { display: grid; gap: 4px; }
.field input, .field select, input.text { padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--surface-2);
  background: var(--surface); width: 100%; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .8rem; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); display: flex;

  box-shadow: 0 -1px 6px rgba(0,0,0,.1); z-index: 10; }
nav.tabs button { border: 0; background: transparent; display: grid; justify-items: center; font-size: .72rem;
  color: var(--muted); cursor: pointer; padding: 4px 10px; border-radius: 14px; }
nav.tabs button .ic { font-size: 1.3rem; }
nav.tabs button.on { color: var(--primary); background: var(--surface-2); }
.mini { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom)); background: var(--navy-dark);
  color: #fff; display: none; align-items: center; gap: 8px; padding: 6px 16px; z-index: 9; }
.mini.show { display: flex; }
.mini button { background: none; border: 0; color: var(--gold); font-size: 1.2rem; cursor: pointer; }
.surah { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.num { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; font-weight: 700; flex: none; font-size: .9rem; }

  font-family: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif; }
.ayah .sv { margin-top: 6px; font-size: .95rem; }

.tasbih-btn { width: 240px; height: 240px; border-radius: 50%; border: 3px solid var(--gold);
  background: radial-gradient(var(--navy), var(--navy-dark)); color: #fff; cursor: pointer; display: grid;
  place-items: center; position: relative; -webkit-tap-highlight-color: transparent; user-select: none; }
.tasbih-btn b { font-size: 4rem; }

.ring { position: absolute; inset: -14px; }
.video-card { padding: 0; overflow: hidden; }
.thumb { position: relative; aspect-ratio: 16/9; background: #000 center/cover no-repeat; }
.thumb .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem;
  background: rgba(0,0,0,.15); color: var(--gold); }
.thumb.locked .play { background: rgba(0,0,0,.55); color: #fff; }

video { width: 100%; display: block; background: #000; }
.overlay { position: fixed; inset: 0; background: rgba(5,8,30,.92); z-index: 50; display: none; overflow-y: auto; }
.overlay.show { display: block; }
.overlay .box { max-width: 480px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 20px 24px;
  color: #fff; display: grid; gap: 14px; justify-items: center; text-align: center; }
.scanner { width: 100%; aspect-ratio: 1; background: #000; border-radius: 20px; overflow: hidden; position: relative; }
.scanner video { width: 100%; height: 100%; object-fit: cover; }
.scanner::after { content: ""; position: absolute; inset: 18%; border: 3px solid var(--gold); border-radius: 18px; }
.compass { width: min(300px, 80vw); aspect-ratio: 1; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--navy-dark); color: #fff;
  padding: 10px 16px; border-radius: 12px; z-index: 60; display: none; max-width: 90vw; }
.toast.show { display: block; }
.hidden { display: none !important; }
.center { text-align: center; }
.qrbox { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; }
</style>

<main id="app"></main>

<div class="overlay" id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
/* ------------------------------------------------------------------ config */
const CONFIG = {
  website: "https://www.islamiskaforbundet.se",
  swishNumber: "",          // fill in to enable Swish donations
  bankgiro: "",
  premiumCodeKey: "__PREMIUM_CODE_KEY__",
  zakatPercent: 98,
};
const VIDEOS = /*VIDEOS_JSON*/[];

/* ------------------------------------------------------------------ storage */
const store = {
  get(k, d) { try { const v = localStorage.getItem("if_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("if_" + k, JSON.stringify(v)); } catch {} },
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms); }
const pad2 = n => String(n).padStart(2, "0");
const hm = d => d ? pad2(d.getHours()) + ":" + pad2(d.getMinutes()) : "–";
const dayKey = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());

/* ------------------------------------------------------------------ prayer times (PrayTimes algorithm) */
const PRAYERS = [
  { id: "FAJR", sv: "Fajr", ar: "الفجر" }, { id: "DHUHR", sv: "Dhuhr", ar: "الظهر" },
  { id: "ASR", sv: "Asr", ar: "العصر" }, { id: "MAGHRIB", sv: "Maghrib", ar: "المغرب" }, { id: "ISHA", sv: "Isha", ar: "العشاء" },
];
const METHODS = [
  { label: "Muslim World League", fajr: 18, isha: 17 }, { label: "ISNA (Nordamerika)", fajr: 15, isha: 15 },
  { label: "Egyptian General Authority", fajr: 19.5, isha: 17.5 }, { label: "Umm al-Qura, Mecka", fajr: 18.5, isha: 90, ishaMin: true },
  { label: "Karachi", fajr: 18, isha: 18 },
];
const CITIES = [["Stockholm",59.3293,18.0686],["Göteborg",57.7089,11.9746],["Malmö",55.6050,13.0038],["Uppsala",59.8586,17.6389],
  ["Västerås",59.6099,16.5448],["Örebro",59.2753,15.2134],["Linköping",58.4108,15.6214],["Helsingborg",56.0465,12.6945],
  ["Jönköping",57.7826,14.1618],["Norrköping",58.5877,16.1924],["Lund",55.7047,13.1910],["Umeå",63.8258,20.2630],
  ["Gävle",60.6749,17.1413],["Borås",57.7210,12.9401],["Södertälje",59.1955,17.6253],["Eskilstuna",59.3666,16.5077],
  ["Halmstad",56.6745,12.8578],["Växjö",56.8777,14.8091],["Karlstad",59.4022,13.5115],["Sundsvall",62.3908,17.3069],
  ["Luleå",65.5848,22.1547],["Kiruna",67.8558,20.2253]];
const R = Math.PI / 180;
const dsin = d => Math.sin(d * R), dcos = d => Math.cos(d * R), dtan = d => Math.tan(d * R);
const fix = (a, b) => { const r = a - b * Math.floor(a / b); return r < 0 ? r + b : r; };
function julian(y, m, d) { if (m <= 2) { y--; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
function sunPos(jd) { const D = jd - 2451545; const g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
  const L = fix(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360), e = 23.439 - 0.00000036 * D;
  const RA = fix(Math.atan2(dcos(e) * dsin(L), dcos(L)) / R / 15, 24);
  return { decl: Math.asin(dsin(e) * dsin(L)) / R, eqt: q / 15 - RA }; }
function prayerTimes(date, lat, lng, method, hanafi) {
  const noonLocal = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const tz = -noonLocal.getTimezoneOffset() / 60;
  const jDate = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / (15 * 24);
  const mid = t => fix(12 - sunPos(jDate + t).eqt, 24);
  const sat = (a, t, ccw) => { const dec = sunPos(jDate + t).decl;
    const tt = Math.acos((-dsin(a) - dsin(dec) * dsin(lat)) / (dcos(dec) * dcos(lat))) / R / 15; return mid(t) + (ccw ? -tt : tt); };
  const asrT = (f, t) => { const dec = sunPos(jDate + t).decl; return sat(-Math.atan(1 / (f + dtan(Math.abs(lat - dec)))) / R, t, false); };
  let fajr = sat(method.fajr, 5 / 24, true); const sunrise = sat(0.833, 6 / 24, true), dhuhr = mid(0.5);
  const asr = asrT(hanafi ? 2 : 1, 13 / 24), sunset = sat(0.833, 18 / 24, false);
  let isha = method.ishaMin ? sunset + method.isha / 60 : sat(method.isha, 18 / 24, false);
  const night = fix(sunrise - sunset, 24);
  if (!isNaN(night)) {
    const fp = method.fajr / 60 * night; if (isNaN(fajr) || fix(sunrise - fajr, 24) > fp) fajr = sunrise - fp;
    if (!method.ishaMin) { const ip = method.isha / 60 * night; if (isNaN(isha) || fix(isha - sunset, 24) > ip) isha = sunset + ip; }
  }
  const shift = tz - lng / 15, start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const at = (h, extra = 0) => isNaN(h) ? null : new Date(start.getTime() + Math.round((h + shift) * 60) * 60000 + extra * 60000);
  return { FAJR: at(fajr), SUNRISE: at(sunrise), DHUHR: at(dhuhr, 1), ASR: at(asr), MAGHRIB: at(sunset, 1), ISHA: at(isha) };
}
const settings = () => ({ lat: store.get("lat", 59.3293), lng: store.get("lng", 18.0686), place: store.get("place", "Stockholm"),
  method: METHODS[store.get("method", 0)] || METHODS[0], hanafi: store.get("hanafi", false) });
function timesFor(d) { const s = settings(); return prayerTimes(d, s.lat, s.lng, s.method, s.hanafi); }
function nextPrayer(now = new Date(), filter = () => true) {
  for (let o = 0; o < 3; o++) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + o); const t = timesFor(d);
    for (const p of PRAYERS) if (t[p.id] && t[p.id] > now && filter(p)) return { p, time: t[p.id] }; }
  return null;
}
const alarmOn = p => store.get("alarm_" + p.id, p.id === "FAJR");
const prayedMask = d => store.get("log_" + dayKey(d), 0);
function setPrayed(d, i, on) { const m = prayedMask(d); store.set("log_" + dayKey(d), on ? m | (1 << i) : m & ~(1 << i)); }
const bits = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };

/* ------------------------------------------------------------------ SHA-256 / HMAC (for Premium codes, works offline) */
function sha256(bytes) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, withPad = new Uint8Array(((l + 9 + 63) >> 6) << 6); withPad.set(bytes); withPad[l] = 0x80;
  const dv = new DataView(withPad.buffer); dv.setUint32(withPad.length - 4, l * 8); dv.setUint32(withPad.length - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < withPad.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3), s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  const out = new Uint8Array(32); const odv = new DataView(out.buffer); H.forEach((v, i) => odv.setUint32(i * 4, v)); return out;
}
function hmacHex(key, msg) {
  const enc = new TextEncoder(); let k = enc.encode(key); if (k.length > 64) k = sha256(k);
  const kk = new Uint8Array(64); kk.set(k);
  const ip = kk.map(b => b ^ 0x36), op = kk.map(b => b ^ 0x5c), m = enc.encode(msg);
  const inner = new Uint8Array(64 + m.length); inner.set(ip); inner.set(m, 64);
  const ih = sha256(inner), outer = new Uint8Array(96); outer.set(op); outer.set(ih, 64);
  return [...sha256(outer)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ------------------------------------------------------------------ premium */
const premium = {
  get trialUntil() { return store.get("trial_until", 0); },
  get active() { return this.trialUntil > Date.now(); },
  redeem(raw) {
    const p = String(raw).trim().split("|");
    if (p.length !== 4 || p[0] !== "IFPREMIUM1") return { status: "invalid" };
    const days = parseInt(p[2], 10); if (!(days >= 1 && days <= 365)) return { status: "invalid" };
    if (hmacHex(CONFIG.premiumCodeKey, `IFPREMIUM1|${p[1]}|${days}`).slice(0, 20) !== p[3].toLowerCase()) return { status: "invalid" };
    if (store.get("campaign_" + p[1], false)) return { status: "used" };
    const until = Math.max(Date.now(), this.trialUntil) + days * 86400000;
    store.set("campaign_" + p[1], true); store.set("trial_until", until);
    return { status: "ok", days, until };
  },
};

/* ------------------------------------------------------------------ QR scanning (BarcodeDetector or jsQR) */
let jsQRPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return jsQRPromise ||= new Promise((ok, fail) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = () => ok(window.jsQR); s.onerror = fail; document.head.appendChild(s); });
}
async function decodeFrom(source, w, h) {

async function startScanner(container, onCode) {

    while (alive) {

}

let ringing = null;
function ringAlarm(p, time) {

    const pulse = () => { if (!ringing) return; const t = ctx.currentTime; gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.4, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); ringing.to = setTimeout(pulse, 900); };
    ringing = { stop: () => {} }; pulse(); } catch { ringing = { stop: () => {} }; }
  if (navigator.vibrate) vib = setInterval(() => navigator.vibrate([800, 400]), 1200);
  if ("Notification" in window && Notification.permission === "granted") try { new Notification("Dags för " + p.sv, { body: "Skanna din bönematta", icon: "logo.png" }); } catch {}
  const stopAll = () => { if (!ringing) return; clearTimeout(ringing.to); try { osc.stop(); ctx.close(); } catch {} clearInterval(vib); if (navigator.vibrate) navigator.vibrate(0); ringing = null; };
  ringing.stop = stopAll; const auto = setTimeout(() => { stopAll(); closeOverlay(); }, 15 * 60000);
  const mat = store.get("mat_code", null);
  const done = () => { setPrayed(time, PRAYERS.indexOf(p), true); stopAll(); clearTimeout(auto);
    $("#overlayBox").innerHTML = `<img src="logo.png" width="72" alt=""><h2 style="color:var(--gold)">Må Allah acceptera din bön 🤲</h2>`; setTimeout(() => { closeOverlay(); render(); }, 2500); };

    ${mat ? `<p id="hint">Gå till din bönematta och skanna koden på den</p><div id="scan" style="width:100%"></div><button class="btn text" id="emerg" style="color:#999">Nödstopp (räknas inte som bön)</button>`
          : `<p>Du har inte registrerat någon bönematta ännu.</p><button class="btn gold" id="off">Stäng av larmet</button>`}`, () => { stopAll(); clearTimeout(auto); });
  if (mat) {
    startScanner($("#scan"), code => { if (code === mat) done(); else { $("#hint").textContent = "Det där är inte din bönematta"; } })
      .then(stop => { const prev = overlayCleanup; overlayCleanup = () => { stop(); prev && prev(); }; });

  } else { $("#off").onclick = done; }
}
function alarmWatcher() {
  const now = new Date(), last = store.get("last_alarm", 0);

  for (const p of PRAYERS) { const at = t[p.id]; if (!at || !alarmOn(p)) continue;

}

        <button class="icon-btn" data-play="${s.n}" aria-label="Lyssna">${playing === s.n && !audio().paused ? "⏸" : "▶️"}</button><button class="btn" data-go="surah/${s.n}">Läs</button></div>`).join("");
    document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { const n = +b.dataset.play;
      if (playing === n) { audio().paused ? audio().play() : audio().pause(); } else playSurah(n); setTimeout(list, 100); });
  };
  $("#q").oninput = e => { quranQuery = e.target.value; list(); }; list();
};
views.surah = (n) => { const s = SURAHS[n - 1];
  return hero(`${s.n}. ${s.name}`, `${s.meaning} · ${s.ayahs} verser`, `<button class="icon-btn" id="sp" style="color:var(--gold);font-size:2rem">▶</button>`) + `<div class="pad">
    <div class="chips">${RECITERS.map(r => `<button class="chip ${store.get("reciter", "ar.alafasy") === r[0] ? "on" : ""}" data-rec="${r[0]}">${r[1]}</button>`).join("")}
    <button class="chip ${store.get("showSv", true) ? "on" : ""}" id="svT">Svenska</button></div><div id="text">Laddar…</div></div>`; };
views.surah.mount = async (n) => {

  $("#svT").onclick = () => { store.set("showSv", !store.get("showSv", true)); render(); };
  const key = "surah_" + n; let data = null;

/* qibla */
const KAABA = [21.422487, 39.826206];
function qiblaBearing(lat, lng) { const p = lat * R, pk = KAABA[0] * R, dl = (KAABA[1] - lng) * R;
  return (Math.atan2(Math.sin(dl), Math.cos(p) * Math.tan(pk) - Math.sin(p) * Math.cos(dl)) / R + 360) % 360; }
function distKm(a, b, c, d) { const x = Math.sin((c - a) * R / 2) ** 2 + Math.cos(a * R) * Math.cos(c * R) * Math.sin((d - b) * R / 2) ** 2; return 6371 * 2 * Math.asin(Math.sqrt(x)); }
let headingHandler = null;
views.qibla = () => { const s = settings(), q = qiblaBearing(s.lat, s.lng);
  const ticks = Array.from({ length: 72 }, (_, i) => { const a = i * 5 * R, l = i % 18 === 0 ? 14 : i % 2 === 0 ? 8 : 4;
    return `<line x1="${150 + 135 * Math.sin(a)}" y1="${150 - 135 * Math.cos(a)}" x2="${150 + (135 - l) * Math.sin(a)}" y2="${150 - (135 - l) * Math.cos(a)}" stroke="${i === 0 ? "#d33" : "currentColor"}" stroke-width="${i % 18 === 0 ? 3 : 1.5}"/>`; }).join("");
  return hero("Qibla", `${s.place} · ${Math.round(distKm(s.lat, s.lng, ...KAABA))} km till Mecka`) + `<div class="pad center">
    <b id="qstatus">Tryck på Starta kompass och vrid telefonen tills pilen pekar uppåt</b>
    <svg class="compass" viewBox="0 0 300 300" style="margin:0 auto;color:var(--primary)">
      <circle cx="150" cy="150" r="140" fill="color-mix(in srgb, var(--primary) 10%, transparent)" stroke="currentColor" stroke-width="4" id="qring"/>
      <g id="dial">${ticks}<text x="150" y="44" text-anchor="middle" fill="#d33" font-weight="700">N</text></g>
      <g id="arrow" transform="rotate(${q} 150 150)"><path d="M150 38 L132 160 L150 150 L168 160 Z" fill="#C4B357"/><rect x="141" y="16" width="18" height="18" fill="#111"/><rect x="141" y="21" width="18" height="3" fill="#C4B357"/></g>
      <circle cx="150" cy="150" r="6" fill="#C4B357"/></svg>
    <div style="font-size:1.3rem;font-weight:700">Qibla: ${Math.round(q)}° från norr</div><div id="qhead" class="muted"></div>
    <button class="btn" id="qstart">🧭 Starta kompass</button>
    <p class="muted">Håll telefonen plant och undan från metall. Utan kompass: rikta dig ${Math.round(q)}° medurs från norr.</p></div>`; };
views.qibla.mount = () => { const s = settings(), q = qiblaBearing(s.lat, s.lng);
  const onH = h => { const t = ((q - h) % 360 + 360) % 360; $("#arrow")?.setAttribute("transform", `rotate(${t} 150 150)`);
    $("#dial")?.setAttribute("transform", `rotate(${-h} 150 150)`); const ok = t < 4 || t > 356;
    const st = $("#qstatus"); if (st) { st.textContent = ok ? "Du är vänd mot Qibla ✓" : "Vrid telefonen tills pilen pekar uppåt"; st.style.color = ok ? "var(--gold)" : ""; }
    const hh = $("#qhead"); if (hh) hh.textContent = `Riktning just nu: ${Math.round(h)}°`; };
  headingHandler = e => { let h = null; if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading; else if (e.absolute && e.alpha !== null) h = 360 - e.alpha; if (h !== null) onH(h); };
  $("#qstart").onclick = async () => {
    try { if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) { if (await DeviceOrientationEvent.requestPermission() !== "granted") throw 0; } } catch { return toast("Kompassen fick inte behörighet"); }
    window.addEventListener("deviceorientationabsolute", headingHandler); window.addEventListener("deviceorientation", headingHandler); $("#qstart").classList.add("hidden");
  };
};

/* donate */
const CAUSES = [["Allmän gåva","Stöd Islamiska Förbundets verksamhet där behovet är störst."],["Zakat","Din obligatoriska zakat fördelas till de berättigade grupperna."],
  ["Sadaqa","Frivillig välgörenhet till behövande."],["Moské och lokaler","Drift och underhåll av moskéer och samlingslokaler."],
  ["Utbildning och ungdom","Koranskola, föreläsningar och ungdomsverksamhet."],["Ramadan & iftar","Iftar-måltider och Ramadan-aktiviteter."]];
const don = { cause: 0, amount: "200" };
views.donate = () => hero("Donera", "Stöd Islamiska Förbundet") + `<div class="pad">
  <p style="color:var(--primary)">"Den som ger i Guds väg är som ett sädeskorn som skjuter sju ax, och i varje ax finns hundra korn." (2:261)</p>
  <h2 class="section">Ändamål</h2><div class="chips">${CAUSES.map((c, i) => `<button class="chip ${i === don.cause ? "on" : ""}" data-cause="${i}">${c[0]}</button>`).join("")}</div>
  <div class="muted">${CAUSES[don.cause][1]}</div>
  <h2 class="section">Belopp</h2><div class="chips">${[100, 200, 500, 1000, 2500].map(a => `<button class="chip ${don.amount == a ? "on" : ""}" data-amt="${a}">${a} kr</button>`).join("")}</div>
  <label class="field"><span class="muted">Eget belopp (kr)</span><input id="amt" inputmode="numeric" value="${esc(don.amount)}"></label>
  <button class="btn gold block" id="pay">${CONFIG.swishNumber ? `Swisha ${esc(don.amount)} kr` : "Donera via webbplatsen"}</button>
  ${CONFIG.swishNumber ? `<div class="muted">Swish-nummer: ${esc(CONFIG.swishNumber)}</div>` : ""}
  ${CONFIG.bankgiro ? `<div class="card"><b>Bankgiro</b><div>${esc(CONFIG.bankgiro)}</div><div class="muted">Märk betalningen med "${CAUSES[don.cause][0]}".</div></div>` : ""}
  <a class="btn outline block" href="${CONFIG.website}" target="_blank" rel="noopener">Fler sätt att ge på islamiskaforbundet.se</a></div>`;
views.donate.mount = () => {
  document.querySelectorAll("[data-cause]").forEach(b => b.onclick = () => { don.cause = +b.dataset.cause; render(); });
  document.querySelectorAll("[data-amt]").forEach(b => b.onclick = () => { don.amount = b.dataset.amt; render(); });
  $("#amt").oninput = e => { don.amount = e.target.value.replace(/\D/g, "").slice(0, 7); e.target.value = don.amount; };
  $("#pay").onclick = () => { if (!CONFIG.swishNumber) return window.open(CONFIG.website, "_blank");
    const amt = parseInt(don.amount, 10) || 0;
    const data = { version: 1, payee: { value: CONFIG.swishNumber.replace(/\D/g, "") }, amount: { value: amt, editable: !amt }, message: { value: CAUSES[don.cause][0], editable: false } };
    location.href = "swish://payment?data=" + encodeURIComponent(JSON.stringify(data)); };
};

/* videos */
views.videos = () => hero("Islamiska videor", premium.active ? "Premium · alla videor" : "Lås upp fler med Premium") + `<div class="pad">${banner()}
  ${VIDEOS.map(v => { const locked = v.premium && !premium.active; const d = Math.round(v.duration);
    return `<div class="card click video-card" data-go="${locked ? "premium" : "video/" + v.slug}"><div class="thumb ${locked ? "locked" : ""}" style="background-image:url('thumbs/thumb_${v.slug}.jpg')">
      <div class="play">${locked ? "🔒" : "▶"}</div><span class="dur">${Math.floor(d / 60)}:${pad2(d % 60)}</span></div>
      <div class="row" style="padding:12px 14px"><div class="grow"><b>${esc(v.title)}</b><div class="muted">${esc(v.subtitle)}</div></div>${v.premium ? '<span class="tag">Premium</span>' : ""}</div></div>`; }).join("")}</div>`;
views.video = (slug) => { const v = VIDEOS.find(x => x.slug === slug); if (!v) return views.videos();
  if (v.premium && !premium.active) return views.premium();
  return `<video id="vid" src="videos/video_${v.slug}.mp4" controls playsinline autoplay></video><div class="pad">
    <h2 style="margin:0">${esc(v.title)}</h2><div class="muted">${esc(v.subtitle)}</div>
    <label class="row card"><div class="grow"><b>Berättarröst</b><div class="muted" id="ttsInfo">Läser texten högt på svenska</div></div><input type="checkbox" id="narr" ${store.get("narration", true) ? "checked" : ""}></label>
    <p class="muted">Animerad video av Islamiska Förbundet. Texten visas även i bild.</p></div>`; };
let narrTimer = null;
views.video.mount = (slug) => { const v = VIDEOS.find(x => x.slug === slug), vid = $("#vid"); if (!v || !vid) return;
  audio().pause(); const synth = window.speechSynthesis;
  if (!synth) { $("#narr").disabled = true; $("#ttsInfo").textContent = "Webbläsaren saknar talsyntes"; }
  $("#narr").onchange = e => { store.set("narration", e.target.checked); if (!e.target.checked) synth && synth.cancel(); };
  const voice = () => (synth?.getVoices() || []).find(x => /^sv/i.test(x.lang));
  let last = 0;
  narrTimer = setInterval(() => { if (!synth) return; const now = vid.currentTime;
    if (vid.paused) { synth.cancel(); last = now; return; }
    if (now < last || now - last > 1.5) { synth.cancel(); last = now; return; }
    if (store.get("narration", true)) { const cue = v.cues.find(c => c.t > last && c.t <= now);
      if (cue) { synth.cancel(); const u = new SpeechSynthesisUtterance(cue.text); u.lang = "sv-SE"; const vo = voice(); if (vo) u.voice = vo; u.rate = 0.95; synth.speak(u); } }
    last = now; }, 150);
};

/* premium */

    $("#cancel").onclick = closeOverlay;

      if (r.status === "invalid") { $("#smsg").textContent = "Ogiltig kod – försök igen."; return; } closeOverlay(); show(r); }).then(stop => overlayCleanup = stop);
  };
  $("#codeImg").onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { const code = await decodeImageFile(f); show(code ? premium.redeem(code) : { status: "invalid" }); } catch { show({ status: "invalid" }); } };

/* hajj calculator */
const TRIPS = { hajj: { label: "Hajj", days: 21, pkg: 75000, hady: 2500 }, umrah: { label: "Umrah", days: 10, pkg: 18000, hady: 0 } };
const hc = { trip: "hajj", v: null };
function hajjDefaults(t) { const T = TRIPS[t]; return [["Antal personer", 1, 0], ["Resepaket per person (flyg, hotell, transport)", T.pkg, 1], ["Visum och avgifter per person", 2000, 1],
  ["Antal dagar", T.days, 0], ["Mat per person och dag", 250, 1], ["Offerdjur (hady) per person", T.hady, 1], ["Fickpengar och gåvor per person", 3000, 1],
  ["Månader kvar till resan", 12, 0], ["Redan sparat", 0, 1]]; }
views.hajj = () => { if (!hc.v) hc.v = hajjDefaults(hc.trip);
  return hero("Pengarkalkyl", "Planera och spara till din resa") + `<div class="pad">
    <div class="chips">${Object.entries(TRIPS).map(([k, t]) => `<button class="chip ${k === hc.trip ? "on" : ""}" data-trip="${k}">${t.label}</button>`).join("")}</div>
    <div class="card" id="hres"></div>
    ${hc.v.map((f, i) => `<label class="field"><span class="muted">${f[0]}${f[2] ? " (kr)" : ""}</span><input inputmode="numeric" data-h="${i}" value="${f[1]}"></label>`).join("")}
    <p class="muted">Förifyllda belopp är ungefärliga uppskattningar. Kontrollera aktuella priser hos en godkänd resebyrå. Hajj är en plikt för den som har råd – planera utan lån med ränta.</p></div>`; };
views.hajj.mount = () => {
  const fmt = n => n.toLocaleString("sv-SE");
  const calc = () => { const v = hc.v.map(f => +f[1] || 0); const per = v[1] + v[2] + v[3] * v[4] + v[5] + v[6], total = per * v[0];
    const rem = Math.max(0, total - v[8]), months = v[7], monthly = months > 0 ? Math.ceil(rem / months) : rem;
    $("#hres").innerHTML = `<div class="muted">Totalt för ${TRIPS[hc.trip].label}</div><div style="font-size:1.8rem;font-weight:800;color:var(--primary)">${fmt(total)} kr</div>
      <div class="muted">${fmt(per)} kr per person</div><hr style="border:0;border-top:1px solid var(--surface-2)"><b>Spara ${fmt(monthly)} kr i månaden</b>
      <div class="muted">${months > 0 ? `för att ha ${fmt(rem)} kr kvar att spara ihop om ${months} månader` : "Ange antal månader kvar för en sparplan"}</div>`; };
  document.querySelectorAll("[data-h]").forEach(inp => inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 9); hc.v[+inp.dataset.h][1] = inp.value; calc(); });
  document.querySelectorAll("[data-trip]").forEach(b => b.onclick = () => { hc.trip = b.dataset.trip; hc.v = hajjDefaults(hc.trip); render(); });
  calc();
};

/* ------------------------------------------------------------------ router */
function cleanup() { clearInterval(timer); timer = null; clearInterval(narrTimer); narrTimer = null; window.speechSynthesis?.cancel();
  if (headingHandler) { window.removeEventListener("deviceorientationabsolute", headingHandler); window.removeEventListener("deviceorientation", headingHandler); headingHandler = null; } }
function render() {
  cleanup();
  const [name, arg] = (location.hash.slice(1) || "home").split("/");
  const view = views[name] || views.home;
  $("#app").innerHTML = view(arg && !isNaN(arg) ? +arg : arg);
  view.mount && view.mount(arg && !isNaN(arg) ? +arg : arg);
  const tab = ["home", "salah", "quran", "tasbih"].includes(name) ? name : name === "surah" ? "quran" : "more";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.go === tab));
}
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (!g) return; e.preventDefault();
  const to = "#" + g.dataset.go; if (location.hash === to) render(); else { location.hash = to; } window.scrollTo(0, 0); });
window.addEventListener("hashchange", render);
function applyTheme() { const t = store.get("theme", ""); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
$("#miniToggle").onclick = () => { audio().paused ? audio().play() : audio().pause(); };
$("#miniStop").onclick = () => { audio().pause(); playing = null; updateMini(); };
audio().addEventListener("play", updateMini); audio().addEventListener("pause", updateMini);
audio().addEventListener("ended", () => { playing = null; updateMini(); });
audio().addEventListener("error", () => { if (playing) toast("Kunde inte spela upp: kontrollera internetanslutningen"); });
applyTheme(); render(); setInterval(alarmWatcher, 15000); alarmWatcher();
</script>
